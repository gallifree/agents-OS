# Usage (from deploy/): cp .env.example .env, fill it in, then
#   docker compose up -d                       # browser profile from COMPOSE_PROFILES in .env
#   docker compose --profile chromium up -d    # or pick one explicitly (never both)

services:
  app:
    build:
      context: ..
    image: rust-agents/app:dev
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      MASTER_KEY: ${MASTER_KEY:?set MASTER_KEY in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
      VALKEY_URL: redis://valkey:6379
      TYPESENSE_URL: http://typesense:8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage:3900}
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-assets}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      BROWSER_CDP_URL: http://browser:9222
      DOCKER_HOST: tcp://docker-proxy:2375
      INFERENCE_URL: ${INFERENCE_URL:-http://inference:11434}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
      typesense: { condition: service_healthy }
      garage-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/app/api", "health"]
      interval: 10s
      retries: 6
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9
    # Memory records have no TTL and must never be evicted; only TTL'd cache keys are (see AGENTS.md).
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${VALKEY_MAXMEMORY:-1gb}
      - --maxmemory-policy
      - volatile-lru
    volumes:
      - valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  typesense:
    image: typesense/typesense:30.0
    command: ["--data-dir", "/data", "--api-key", "${TYPESENSE_API_KEY:?set TYPESENSE_API_KEY in .env}"]
    volumes:
      - typesense:/data
    healthcheck:
      # The image has no curl/wget; bash's /dev/tcp does the HTTP request.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8108 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"ok\":true' <&3"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  garage:
    image: dxflrs/garage:v2.1.0
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  garage-init:
    image: curlimages/curl:latest
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      S3_BUCKET: ${S3_BUCKET:-assets}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - ./garage/init.sh:/init.sh:ro
    depends_on:
      garage: { condition: service_healthy }
    restart: "no"

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    # Read-only for now; grant POST/IMAGES/... only when app installs and browser profiles need them.
    environment:
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  browser-headless:
    profiles: [headless]
    image: chromedp/headless-shell:stable
    shm_size: 1gb
    networks:
      default:
        aliases: [browser]
    restart: unless-stopped

  browser-chromium:
    profiles: [chromium]
    image: lscr.io/linuxserver/chromium:latest
    shm_size: 1gb
    environment:
      # shortcut: non-headless Chromium binds CDP to 127.0.0.1 only; add a socat sidecar when the app uses CDP with this profile.
      CHROME_CLI: --remote-debugging-port=9222 --user-data-dir=/config/profile
    volumes:
      - chromium:/config
    ports:
      - "127.0.0.1:${CHROMIUM_VIEWER_PORT:-3001}:3001" # KasmVNC viewer, localhost only
    networks:
      default:
        aliases: [browser]
    restart: unless-stopped

  inference:
    profiles: [inference]
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  postgres:
  valkey:
  typesense:
  garage:
  chromium:
  ollama:
