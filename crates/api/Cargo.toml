[package]
name = "api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-graphql = { version = "7.2.1", features = ["uuid", "chrono"] }
async-graphql-axum = "7.2.1"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
crypto = { version = "0.1.0", path = "../crypto" }
fred = { version = "10.1.0", features = ["i-std", "subscriber-client"] }
futures = "0.3.34"
object_store = { version = "0.14.2", features = ["aws"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate", "uuid", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.1", features = ["v7", "serde", "v4"] }

[dev-dependencies]
testcontainers = { version = "0.28.0", default-features = false, features = ["aws-lc-rs"] }
