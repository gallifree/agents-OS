"""
A bearer token for `/v1`. Only its hash is stored.
"""
type ApiKey implements Node {
	id: ID!
	cacheKey: String!
	name: String!
	createdAt: DateTime!
	lastUsedAt: DateTime
}

type CreatedApiKey {
	apiKey: ApiKey!
	"""
	The token, returned this once only.
	"""
	token: String!
}

"""
Implement the DateTime<Utc> scalar

The input/output is a string in RFC3339 format.
"""
scalar DateTime

"""
Requests per provider and model over a period.
"""
type ModelUsage {
	provider: String!
	model: String!
	requests: Int!
	"""
	Requests answered with an error status (≥ 400, including 499: client gone).
	"""
	errors: Int!
	promptTokens: Int!
	completionTokens: Int!
}

type Mutation {
	"""
	Publishes a ping on Valkey pub/sub; every `pings` subscriber, on any backend instance, receives it.
	"""
	ping(message: String!): Boolean!
	"""
	Creates the first admin with the one-time setup code from the server logs, and signs them in.
	"""
	setup(code: String!, username: String!, password: String!): User!
	login(username: String!, password: String!): User!
	logout: Boolean!
	"""
	Also signs out every other session of the user.
	"""
	changePassword(current: String!, new: String!): Boolean!
	"""
	Sets the given preferences; omitted ones keep their value.
	"""
	updatePrefs(theme: String, language: String): User!
	"""
	Admins only.
	"""
	createUser(username: String!, password: String!, isAdmin: Boolean!): User!
	"""
	Admins only. `apiKey` may be empty for local providers.
	"""
	createProvider(name: String!, baseUrl: String!, apiKey: String! = ""): Provider!
	"""
	Admins only. Omitted fields keep their value; an empty `apiKey` removes the key.
	"""
	updateProvider(id: ID!, baseUrl: String, apiKey: String, enabled: Boolean): Provider!
	"""
	Admins only. Usage rows stay (with the provider name).
	"""
	deleteProvider(id: ID!): Boolean!
	"""
	A new API key for the viewer. The token is in the answer only: it can't be shown again.
	"""
	createApiKey(name: String!): CreatedApiKey!
	"""
	Revokes one of the viewer's own keys; takes effect on the next request.
	"""
	revokeApiKey(id: ID!): Boolean!
}

"""
Relay object identification: `id` is an expiring encrypted token, `cacheKey` the stable client identity.
"""
interface Node {
	id: ID!
	cacheKey: String!
}

"""
Information about pagination in a connection
"""
type PageInfo {
	"""
	When paginating backwards, are there more items?
	"""
	hasPreviousPage: Boolean!
	"""
	When paginating forwards, are there more items?
	"""
	hasNextPage: Boolean!
	"""
	When paginating backwards, the cursor to continue.
	"""
	startCursor: String
	"""
	When paginating forwards, the cursor to continue.
	"""
	endCursor: String
}

type Ping {
	message: String!
}

"""
UI preferences, stored per user so they follow them across devices.
"""
type Prefs {
	theme: String
	language: String
}

"""
An OpenAI-compatible upstream. Its models are reached as `"<name>/<model>"` on `/v1`.
"""
type Provider implements Node {
	id: ID!
	cacheKey: String!
	name: String!
	baseUrl: String!
	"""
	The key itself is never sent back.
	"""
	hasApiKey: Boolean!
	enabled: Boolean!
	createdAt: DateTime!
}

type Query {
	"""
	State of every backing service. Admins only: errors expose internal hostnames.
	"""
	systemStatus: [ServiceStatus!]!
	"""
	True until the first admin is created (see the setup code in the server logs).
	"""
	setupRequired: Boolean!
	"""
	The signed-in user, or null.
	"""
	viewer: User
	"""
	Refetches any object by its Relay ID. Returns null for objects the viewer may not see.
	"""
	node(id: ID!): Node
	"""
	All users, oldest first. Admins only.
	"""
	users(after: String, first: Int): UserConnection!
	"""
	Admins only.
	"""
	providers: [Provider!]!
	"""
	Asks the provider for its models: also the connection test. Admins only.
	"""
	providerModels(id: ID!): [String!]!
	"""
	The viewer's own API keys.
	"""
	apiKeys: [ApiKey!]!
	"""
	Usage over the last `days` days (1–365): everyone's for admins, the viewer's own otherwise.
	"""
	llmUsage(days: Int! = 30): [ModelUsage!]!
}

type ServiceStatus {
	name: String!
	ok: Boolean!
	"""
	Optional services (e.g. inference running on the host) may be absent.
	"""
	optional: Boolean!
	version: String
	latencyMs: Int!
	error: String
}

type Subscription {
	pings: Ping!
}

type User implements Node {
	id: ID!
	cacheKey: String!
	username: String!
	isAdmin: Boolean!
	createdAt: DateTime!
	prefs: Prefs!
}

type UserConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [UserEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [User!]!
}

"""
An edge in a connection.
"""
type UserEdge {
	"""
	The item at the end of the edge
	"""
	node: User!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Provides a scalar specification URL for specifying the behavior of custom scalar types.
"""
directive @specifiedBy(url: String!) on SCALAR
schema {
	query: Query
	mutation: Mutation
	subscription: Subscription
}
